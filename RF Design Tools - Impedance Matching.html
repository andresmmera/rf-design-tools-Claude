<style>

:root[data-theme="dark"]{--bg:#16191d;--ink:#e4e7ea;--muted:#9aa4ad;--card:#1e2227;--line:#343a40;--boxbg:#1a1e22;--thead:#2a2f35;--nav:#0f1b2d;--field:#14181c;--primary:#6ea8fe;--grid:#30363c;--warnbg:#332701;--warnink:#ffda6a;--c1:#6ea8fe;--c2:#ff6b70}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);padding:8px 16px}
.brand{font:italic 900 22px Lato,system-ui,sans-serif;color:#fff}.brand span{color:#ffc107}
.container-fluid{padding:12px 16px 32px}

select.w{width:100%}
.btn{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--muted);border-radius:.25rem;padding:.25rem .6rem;color:var(--ink);background:transparent}
.btn:hover{background:var(--thead)}.btn-p{background:#198754;border-color:#198754;color:#fff}.btn-p:hover{background:#157347}.btn-w{background:#ffc107;border-color:#ffc107;color:#000}.btn-w:hover{background:#ffca2c}

kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:12px}
</style></head><body>
<nav class="navbar"><span class="brand">RF <span>Design Tools</span></span></nav>
<div class="container-fluid"><h2 class="tool-name">Impedance Matching Tool</h2>
<div class="row">
<div class="col" id="lf"><div class="box_form" style="width:100%"><h5>Load &amp; Frequency</h5><table class="table"><tbody id="lt"></tbody></table></div><div class="box_form" style="width:100%"><h5>Simulation Parameters</h5><table class="table"><tbody id="st"></tbody></table></div><div class="box_form" style="width:100%"><h5>Display Parameters</h5><table class="table"><tbody id="dt"></tbody></table></div></div>
<div class="box" id="ch">
 <div id="alert" class="alert" hidden></div>
 <div class="card"><h5>Schematic <span class="hint" style="font-weight:400">(click a part, or use <kbd>◀</kbd><kbd>▶</kbd> focus, <kbd>▲</kbd><kbd>▼</kbd> value; Shift = coarse, Alt = fine)</span></h5>
  <div id="schv"><svg id="sv" tabindex="0" height="230"></svg></div></div>
 <div class="two"><div class="card"><h5>Smith chart</h5><canvas id="smith"></canvas></div>
 <div class="card"><h5>|S11| (dB)</h5><canvas id="mag"></canvas></div></div>
 <div class="card"><dl class="sum" id="sum"></dl></div>
 <div class="card" id="exC" hidden><h5 id="exT"></h5><textarea id="exA" readonly spellcheck="false"></textarea><div class="btn-row"><a class="btn" id="exL">Download file</a><button class="btn" id="exCp">Copy text</button></div><p class="hint" id="exN"></p></div>
</div>
<div class="box_form" id="rf"><h5>Automatic Matching</h5><table class="table"><tbody id="rt"></tbody></table>
 <div class="btn-row"><button class="btn btn-p" id="apply">Match</button><button class="btn btn-w" id="optb">Optimize in band</button></div>
 <p class="hint" id="msg"></p>
 <h5 style="margin-top:12px">Components</h5>
 <div class="btn-row"><select id="addt"></select><button class="btn" id="add">Add after focus</button><button class="btn" id="del">Delete</button><button class="btn" id="clr">Clear</button></div>
 <div class="btn-row"><button class="btn" id="bl">◀</button><button class="btn" id="br">▶</button><button class="btn" id="bu">▲</button><button class="btn" id="bd">▼</button></div>
 <table class="table"><tbody><tr><td colspan="2" id="en" style="font-weight:600"></td></tr><tr><td id="evl">Value</td><td><input type="number" id="ev" step="any" style="width:7em"> <span id="evu"></span></td></tr><tr id="ezr"><td>Z<sub>c</sub> (Ω)</td><td><input type="number" id="ez" step="any" style="width:7em"></td></tr></tbody></table>
 <h5>Export</h5><div class="btn-row"><button class="btn" id="exq">Qucs-S (.sch)</button><button class="btn" id="exm">EMerge (.py)</button></div><p class="hint" id="exh"></p>
</div></div></div>
<script>
(()=>{'use strict';
const $=i=>document.getElementById(i),PI=Math.PI,V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ca=(a,b)=>[a[0]+b[0],a[1]+b[1]],cm=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cd=(a,b)=>{const d=b[0]*b[0]+b[1]*b[1]||1e-30;return[(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]};
const g4=v=>+v.toPrecision(4),g3=v=>+v.toPrecision(3);
const row=(l,h,c='')=>`<tr class="${c}"><td>${l}</td><td>${h}</td></tr>`;
const inp=(id,v,w=5)=>`<input type=number id=${id} value=${v} step=any style="width:${w}em">`;
const sel=(id,o,c='')=>`<select id=${id} class="${c}">${o.map(x=>`<option value="${x[0]}">${x[1]}`).join('')}</select>`;
$('lt').innerHTML=row('Load',sel('lm',[['c','R + jX constant'],['s','s1p file']],'w'))+row('R (Ω)',inp('R',20),'ck')+row('X (Ω)',inp('X',30),'ck')+row('s1p file','<input type=file id=fi accept=".s1p,.txt,.S1P">','cs')+row('Z<sub>0</sub> (Ω)',inp('Z0',50))+
row('Freq unit',sel('fu',[[1,'Hz'],[1e3,'kHz'],[1e6,'MHz'],[1e9,'GHz']]))+row('f<sub>0</sub> (match / ref)',inp('f0',1))+row('Band start',inp('f1',.9))+row('Band stop',inp('f2',1.1))+'';
$('st').innerHTML=row('Start freq (unit above)',inp('fa',.5))+row('Stop freq',inp('fb',1.5))+row('Points',inp('np',201,4));
$('dt').innerHTML=row('Y scale (dB/div)',inp('ys',10,4))+row('Y maximum (dB)',inp('ymax',0,4))+row('Y minimum (dB)',inp('ymin',-40,4))+row('X divisions',inp('xt',6,4))+row('Smith impedance grid','<input type=checkbox id=zg checked>')+row('Smith admittance grid','<input type=checkbox id=yg>')+row('Matching path at f0','<input type=checkbox id=mp checked>');
$('fu').value=1e9;
$('rt').innerHTML=row('Method',sel('meth',[['lsec','L-section (lumped)'],['pi','Pi network'],['t','T network'],['xf','Ideal transformer'],['qw','Quarter-wave transformer'],['bin','Multisection binomial'],['cheb','Multisection Chebyshev (opt.)'],['texp','Exponential taper'],['tlin','Linear taper']],'w'))+
row('Match at',sel('tm',[['f','Frequency f0'],['b','Band f1–f2']]))+row('Sections / slices',inp('N',3,4))+row('Q (pi / T)',inp('Q',3,4))+row('Taper length (λ)',inp('TL',1,4))+row('L-section solution',sel('sol',[[1,'1'],[2,'2']]));
const T={sL:['Series L','nH',1e-9,'L'],sC:['Series C','pF',1e-12,'C'],sR:['Series R','Ω',1,'R'],pL:['Shunt L','nH',1e-9,'L'],pC:['Shunt C','pF',1e-12,'C'],pR:['Shunt R','Ω',1,'R'],tl:['Series line','°',1,'TL'],os:['Open stub','°',1,'OS'],ss:['Short stub','°',1,'SS'],xf:['Transformer n:1','',1,'T']};
$('addt').innerHTML=Object.keys(T).map(k=>`<option value="${k}">${T[k][0]}`).join('');
const isSh=t=>t==='pL'||t==='pC'||t==='pR'||t==='os'||t==='ss';
let net=[],cur=0,S1=null,D=null,HV=null,Z0=50,F0=1e9,F1=0,F2=0,FA=0,FB=0,NP=201,YM=-40,YX=0,YS=10,XT=6,UN=1e9;
const rd=()=>{UN=+$('fu').value;const g=i=>+$(i).value*UN;Z0=+$('Z0').value||50;F0=g('f0');F1=g('f1');F2=g('f2');FA=g('fa');FB=g('fb');NP=Math.min(1001,Math.max(11,+$('np').value|0));YX=+$('ymax').value;YM=Math.min(YX-3,+$('ymin').value);YS=Math.max(.5,+$('ys').value||10);XT=Math.min(12,Math.max(2,(+$('xt').value|0)||6))};
const setF=(id,v)=>$(id).value=+(v/UN).toPrecision(6);
/* load */
const zs=s=>{const z=cd(ca([1,0],s),[1-s[0],-s[1]]);return[z[0]*S1.z0,z[1]*S1.z0]};
function ZL(f){if($('lm').value==='s'&&S1){const F=S1.f,n=F.length;let lo=0,hi=n-1;if(f<=F[0])return zs(S1.s[0]);if(f>=F[n-1])return zs(S1.s[n-1]);while(hi-lo>1){const m=(lo+hi)>>1;F[m]>f?hi=m:lo=m}const t=(f-F[lo])/(F[hi]-F[lo]),a=S1.s[lo],b=S1.s[hi];return zs([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])])}return[+$('R').value,+$('X').value]}
function parse(t){let u=1e9,fm='MA',z0=50;const f=[],s=[];for(let l of t.split(/\r?\n/)){l=l.split('!')[0].trim();if(!l)continue;if(l[0]==='#'){const k=l.slice(1).toUpperCase().split(/\s+/).filter(Boolean);k.forEach((w,i)=>{if(w==='HZ')u=1;if(w==='KHZ')u=1e3;if(w==='MHZ')u=1e6;if(w==='GHZ')u=1e9;if(w==='RI'||w==='MA'||w==='DB')fm=w;if(w==='R')z0=+k[i+1]});continue}
const v=l.split(/\s+/).map(Number);if(v.length<3||v.some(isNaN))continue;let re,im;if(fm==='RI'){re=v[1];im=v[2]}else{const m=fm==='DB'?Math.pow(10,v[1]/20):v[1];re=m*Math.cos(v[2]*PI/180);im=m*Math.sin(v[2]*PI/180)}f.push(v[0]*u);s.push([re,im])}return f.length>1?{f,s,z0}:null}
$('fi').addEventListener('change',e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const p=parse(String(r.result));if(!p){alert('Could not parse the s1p file.');return}S1=p;const a=p.f[0],b=p.f[p.f.length-1];$('fu').value=b>=1e9?1e9:b>=1e6?1e6:b>=1e3?1e3:1;rd();const sp=b-a;setF('fa',a);setF('fb',b);setF('f1',a+.25*sp);setF('f2',a+.75*sp);setF('f0',Math.sqrt((a+.25*sp)*(a+.75*sp)));pu=UN;upd()};r.readAsText(fl)});
/* network */
function zin(f,n,zl){let Z=zl;const w=2*PI*f;for(let k=n.length-1;k>=0;k--){const e=n[k],v=e.v;let y;
switch(e.t){case'sL':Z=ca(Z,[0,w*v]);continue;case'sC':Z=ca(Z,[0,-1/(w*v)]);continue;case'sR':Z=ca(Z,[v,0]);continue;case'xf':Z=[Z[0]*v*v,Z[1]*v*v];continue;
case'tl':{const t=Math.tan(v*PI/180*f/F0);Z=cm([e.z,0],cd(ca(Z,[0,e.z*t]),ca([e.z,0],cm([0,t],Z))));continue}
case'pL':y=[0,-1/(w*v)];break;case'pC':y=[0,w*v];break;case'pR':y=[1/v,0];break;
case'os':y=[0,Math.tan(v*PI/180*f/F0)/e.z];break;default:y=[0,-1/(e.z*Math.tan(v*PI/180*f/F0))]}
Z=cd([1,0],ca(cd([1,0],Z),y))}return Z}
const gam=Z=>cd([Z[0]-Z0,Z[1]],[Z[0]+Z0,Z[1]]),mg=g=>Math.hypot(g[0],g[1]),db=g=>20*Math.log10(Math.max(mg(g),1e-6));
/* auto match */
function match(){rd();const band=$('tm').value==='b',m=$('meth').value,f=band?Math.sqrt(F1*F2):F0;if(band){F0=f;setF('f0',f)}
const zl=ZL(f),RL=Math.max(zl[0],.01),XL=zl[1],w=2*PI*f,N=Math.max(1,+$('N').value|0),n=[],msg=[];
const mk=(t,v,z)=>({t,v,z}),ser=X=>Math.abs(X)<1e-9?0:(X>0?mk('sL',X/w):mk('sC',-1/(w*X))),shu=B=>Math.abs(B)<1e-12?0:(B>0?mk('pC',B/w):mk('pL',-1/(w*B))),add=e=>{if(e)n.push(e)};
let opt=band||m==='cheb';
if(m==='lsec'){const sg=$('sol').value==='1'?1:-1;
 if(RL>Z0){const D=Math.sqrt(RL/Z0*Math.max(0,RL*RL+XL*XL-Z0*RL)),B=(XL+sg*D)/(RL*RL+XL*XL),X=1/B+XL*Z0/RL-Z0/(B*RL);add(ser(X));add(shu(B))}
 else{add(shu(sg*Math.sqrt((Z0-RL)/RL)/Z0));add(ser(sg*Math.sqrt(RL*(Z0-RL))-XL))}}
else if(m==='pi'||m==='t'){const mx=Math.max(Z0,RL),mn=Math.min(Z0,RL);let Q=+$('Q').value;const qm=Math.sqrt(mx/mn-1)+.05;if(Q<qm){Q=qm;msg.push('Q raised to the minimum feasible value '+g3(Q)+'.')}
 if(m==='pi'){const Rv=mx/(Q*Q+1),q1=Math.sqrt(Z0/Rv-1),q2=Math.sqrt(RL/Rv-1);add(shu(q1/Z0));add(ser((q1+q2)*Rv));add(shu(q2/RL));add(ser(-XL))}
 else{const Rv=mn*(Q*Q+1),q1=Math.sqrt(Rv/Z0-1),q2=Math.sqrt(Rv/RL-1);add(ser(q1*Z0));add(shu((q1+q2)/Rv));add(ser(q2*RL-XL))}}
else if(m==='xf'){add(mk('xf',Math.sqrt(Z0/RL)));add(ser(-XL))}
else if(m==='qw'){add(mk('tl',90,Math.sqrt(Z0*RL)));add(ser(-XL))}
else if(m==='bin'||m==='cheb'){let Zp=Z0,c=1;for(let k=0;k<N;k++){if(k>0)c=c*(N-k+1)/k;Zp*=Math.exp(Math.pow(2,-N)*c*Math.log(RL/Z0));add(mk('tl',90,Zp))}add(ser(-XL));if(m==='cheb')msg.push('Starts from the binomial design and optimizes Zc and length over the band for an equal-ripple-like response.')}
else{const L=+$('TL').value||1,Ns=Math.max(2,N);for(let k=0;k<Ns;k++){const s=(k+.5)/Ns;add(mk('tl',L*360/Ns,m==='texp'?Z0*Math.pow(RL/Z0,s):Z0+(RL-Z0)*s))}add(ser(-XL));msg.push('Taper of '+Ns+' equal slices, total length '+L+' λ at f0.')}
net=n;cur=0;$('mp').checked=!band;if(m!=='lsec'&&!band&&m!=='cheb')msg.push('Exact at f0 for the load impedance at f0 (reactance cancelled by a series element).');
if(opt){optimize();msg.push('Optimized over '+g4(F1/UN)+'–'+g4(F2/UN)+' '+$('fu').selectedOptions[0].text+'.')}
$('msg').textContent=msg.join(' ');upd()}
function optimize(){rd();const fs=[],zls=[];for(let i=0;i<=40;i++){const f=F1+(F2-F1)*i/40;fs.push(f);zls.push(ZL(f))}
const vs=[];net.forEach((e,k)=>{vs.push([k,'v']);if(e.z!==undefined)vs.push([k,'z'])});
const cost=()=>{let c=0;for(let i=0;i<fs.length;i++)c+=Math.pow(mg(gam(zin(fs[i],net,zls[i]))),4);return c};
let best=cost(),st=.2;for(let it=0;it<250&&st>1e-3;it++){let imp=false;for(const[k,key]of vs)for(const d of[1,-1]){const o=net[k][key];net[k][key]=o*(1+d*st);const c=cost();if(c<best){best=c;imp=true}else net[k][key]=o}if(!imp)st/=2}}
/* schematic */
function sym(t){if(t==='sC'||t==='pC')return'<path d="M-30 0H-4M-4-11V11M4-11V11M4 0H30"/>';
if(t==='sL'||t==='pL')return'<path d="M-30 0H-16a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0H30"/>';
if(t==='sR'||t==='pR')return'<polyline points="-30,0 -20,0 -16,-8 -8,8 0,-8 8,8 16,-8 20,0 30,0"/>';
if(t==='xf')return'<path d="M-30 0H-14M14 0H30"/><circle cx="-7" cy="0" r="10"/><circle cx="7" cy="0" r="10"/>';
return'<path d="M-30 0H-26M26 0H30"/><rect x="-26" y="-10" width="52" height="20"/>'}
const gnd=x=>`<path d="M${x} 160v7M${x-9} 167h18M${x-5} 171h10M${x-2} 175h4"/>`;
const vstr=e=>e.z!==undefined&&e.t!=='xf'?`${g3(e.z)}Ω ${g3(e.v)}°`:e.t==='xf'?g3(e.v)+':1':g3(e.v/T[e.t][2])+T[e.t][1];
function schem(){const n=net.length,W=n*100+160,bus=60,gy=160,cvr='style="fill:var(--card);stroke:none"';
let s=`<line x1="30" y1="${bus}" x2="${W-30}" y2="${bus}"/><polyline points="30,${bus} 30,${bus+22} 22,${bus+30} 38,${bus+46} 22,${bus+62} 38,${bus+78} 30,${bus+86} 30,${gy}"/>${gnd(30)}<text x="30" y="${gy+30}">Zs ${g4(Z0)}Ω</text>
<line x1="${W-30}" y1="${bus}" x2="${W-30}" y2="${bus+30}"/><rect x="${W-44}" y="${bus+30}" width="28" height="56"/><line x1="${W-30}" y1="${bus+86}" x2="${W-30}" y2="${gy}"/>${gnd(W-30)}<text x="${W-30}" y="${gy+30}">ZL</text>`;
net.forEach((e,i)=>{const cx=130+i*100,sh=isSh(e.t),lab=T[e.t][3]+(i+1);

import numpy as np

def ms_width(z, er=ER, h=H):
    A = z/60*np.sqrt((er+1)/2) + (er-1)/(er+1)*(0.23+0.11/er)
